name: Build Release APK

on:
  workflow_dispatch:
    branches:
      - deepLX-test

jobs:
  ffmpeg:
    name: Native Build (FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: deepLX-test

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install yasm
        run: sudo apt install -y yasm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target-level: 34
          build-tools: 34.0.0
          ndk: 21.4.7075529
          cmake: 3.22.1

      - name: Fetch Status
        run: |
          git submodule status TMessagesProj/jni/ffmpeg > ffmpeg_status
          git submodule status TMessagesProj/jni/libvpx > libvpx_status
          cat ffmpeg_status libvpx_status

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/libvpx/build
          key: ffmpeg-${{ hashFiles('ffmpeg_status', 'libvpx_status', 'TMessagesProj/jni/*ffmpeg*.sh', 'TMessagesProj/jni/*libvpx*.sh', 'TMessagesProj/jni/patches/ffmpeg/*') }}

      - name: Build FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init libs libvpx
          ./run init libs ffmpeg
          ls -l TMessagesProj/jni/ffmpeg/build/arm64-v8a/lib || echo "FFmpeg build directory not found"

  boringssl:
    name: Native Build (BoringSSL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: deepLX-test

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target-level: 34
          build-tools: 34.0.0
          ndk: 21.4.7075529
          cmake: 3.22.1

      - name: Fetch Status
        run: git submodule status TMessagesProj/jni/boringssl > boringssl_status

      - name: Cache BoringSSL
        id: cache-boringssl
        uses: actions/cache@v4
        with:
          path: TMessagesProj/jni/boringssl/build
          key: boringssl-${{ hashFiles('boringssl_status') }}

      - name: Build BoringSSL
        if: steps.cache-boringssl.outputs.cache-hit != 'true'
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init libs boringssl
          ls -l TMessagesProj/jni/boringssl/build/arm64-v8a/lib || echo "BoringSSL build directory not found"

  native:
    name: Native Build (Telegram)
    runs-on: ubuntu-latest
    needs:
      - ffmpeg
      - boringssl
    strategy:
      matrix:
        flavor: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: deepLX-test

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target-level: 34
          build-tools: 34.0.0
          ndk: 21.4.7075529
          cmake: 3.22.1

      - name: Fetch Status
        run: |
          git submodule status TMessagesProj/jni/ffmpeg > ffmpeg_status
          git submodule status TMessagesProj/jni/libvpx > libvpx_status
          git submodule status TMessagesProj/jni/boringssl > boringssl_status
          cat ffmpeg_status libvpx_status boringssl_status

      - name: Cache Native
        id: cache-native
        uses: actions/cache@v4
        with:
          path: TMessagesProj/src/main/libs
          key: native-${{ matrix.flavor }}-${{ hashFiles('TMessagesProj/jni/**', 'ffmpeg_status', 'libvpx_status', 'boringssl_status') }}

      - name: Restore FFmpeg Cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/libvpx/build
          key: ffmpeg-${{ hashFiles('ffmpeg_status', 'libvpx_status', 'TMessagesProj/jni/*ffmpeg*.sh', 'TMessagesProj/jni/*libvpx*.sh', 'TMessagesProj/jni/patches/ffmpeg/*') }}

      - name: Restore BoringSSL Cache
        uses: actions/cache@v4
        with:
          path: TMessagesProj/jni/boringssl/build
          key: boringssl-${{ hashFiles('boringssl_status') }}

      - name: Fix BoringSSL Patch
        run: |
          cd TMessagesProj/jni
          ./patch_boringssl.sh || true
          ls -l boringssl/build/arm64-v8a/lib || echo "BoringSSL patch failed or directory not found"

      - name: Build Native
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          export NATIVE_TARGET="${{ matrix.flavor }}"
          ./run libs native
          ls -l TMessagesProj/src/main/libs/${{ matrix.flavor }} || echo "Native libs directory not found"

  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    needs: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: deepLX-test

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target-level: 34
          build-tools: 34.0.0
          ndk: 21.4.7075529
          cmake: 3.22.1

      - name: Fetch Status
        run: |
          git submodule status TMessagesProj/jni/ffmpeg > ffmpeg_status
          git submodule status TMessagesProj/jni/libvpx > libvpx_status
          git submodule status TMessagesProj/jni/boringssl > boringssl_status
          cat ffmpeg_status libvpx_status boringssl_status

      - name: Restore Native Caches for All Flavors
        uses: actions/cache@v4
        with:
          path: TMessagesProj/src/main/libs
          key: native-${{ hashFiles('TMessagesProj/jni/**', 'ffmpeg_status', 'libvpx_status', 'boringssl_status') }}

      - name: Restore FFmpeg Cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/libvpx/build
          key: ffmpeg-${{ hashFiles('ffmpeg_status', 'libvpx_status', 'TMessagesProj/jni/*ffmpeg*.sh', 'TMessagesProj/jni/*libvpx*.sh', 'TMessagesProj/jni/patches/ffmpeg/*') }}

      - name: Restore BoringSSL Cache
        uses: actions/cache@v4
        with:
          path: TMessagesProj/jni/boringssl/build
          key: boringssl-${{ hashFiles('boringssl_status') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          echo "TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}" >> local.properties
          echo "TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}" >> local.properties
          echo "ALIAS_NAME=${{ secrets.ALIAS_NAME }}" >> local.properties
          echo "KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}" >> local.properties
          echo "ALIAS_PASS=${{ secrets.ALIAS_PASS }}" >> local.properties

      - name: Decode and place keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: TMessagesProj/build/outputs/apk/release/*.apk
          retention-days: 7
