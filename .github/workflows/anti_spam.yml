name: Anti-Spam

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  spam-check:
    runs-on: ubuntu-latest

    steps:
      - name: Detect spam
        id: spam
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.sender.login;
            const target = context.payload.issue || context.payload.pull_request;

            let spam = false;

            const title = (target.title || "").toLowerCase();
            const body = (target.body || "").toLowerCase();
            const { data: user } = await github.rest.users.getByUsername({
              username
            });
            const created = new Date(user.created_at);
            const ageDays = (Date.now() - created.getTime()) / (1000 * 60 * 60 * 24);
            core.setOutput("is_new_acc", ageDays < 30);

            const patterns = [
              /\baerogram\b/i,
              /\bmd3\b/i,
              /\bdisgust\b/i,
              /\btelegram\b/i,
            ];
            spam = patterns.some(re => re.test(title) || re.test(body));

            core.setOutput("spam", spam);

      - name: Close issue or PR
        if: ${{steps.spam.outputs.spam == 'true' || steps.spam.outputs.is_new_acc == 'true'}}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: "not_planned"
            });

      - name: Lock issue or PR
        if: ${{steps.spam.outputs.spam == 'true' || steps.spam.outputs.is_new_acc == 'true'}}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.lock({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              lock_reason: "spam"
            });

      - name: Add spam label
        if: steps.spam.outputs.spam == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["spam"]
              });
            } catch (e) {}

      - name: Block user
        if: steps.spam.outputs.spam == 'true'
        env:
          USERNAME: ${{ github.event.sender.login }}
          GH_TOKEN: ${{ secrets.ORG_ADMIN_PAT }}
        run: |
          curl -L \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/user/blocks/$USERNAME
