apply plugin: 'com.android.library'

android {
    compileSdk 34

    defaultConfig {
        // API-Version . minor
        minSdkVersion 21
        // targetSdkVersion 31
    }

    // buildToolsVersion '31.0.0'
    lint {
        abortOnError = false
    }
    buildFeatures {
        aidl = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace = 'org.openintents.openpgp'
}